name: engine-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger engine
        run: |
          curl -sS --max-time 90 "https://gchat-iq-signals.vercel.app/api/engine?secret=${{ secrets.ENGINE_SECRET }}&email=1" || true
